<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반짝반짝 한자 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff9a9e;
            --secondary-color: #fad0c4;
            --accent-color: #ffecd2;
            --text-color: #5d5d5d;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        #game-container {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 5px solid var(--secondary-color);
        }

        h1 { color: #ff6b6b; font-size: 2.5rem; margin-bottom: 20px; }
        .info-text { font-size: 1.2rem; margin-bottom: 10px; }

        input[type="text"], select {
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 15px;
            border: 2px solid var(--secondary-color);
            width: 80%;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
            font-family: 'Jua', sans-serif;
            background-color: white;
        }

        button {
            padding: 12px 30px;
            font-size: 1.3rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Jua', sans-serif;
        }

        button:hover { transform: scale(1.05); }

        .quiz-box { display: none; }
        .word-display { font-size: 4.5rem; color: #4834d4; margin: 10px 0; font-weight: bold; }
        .mean-display { font-size: 2.2rem; color: #eb4d4b; margin: 15px 0; }

        .options { display: grid; gap: 10px; margin-top: 20px; }
        .option-btn { background: #f0f0f0; color: #333; font-size: 1.2rem; padding: 15px; border-radius: 15px; border: none; cursor: pointer; font-family: 'Jua', sans-serif; }
        .option-btn:hover { background: var(--secondary-color); }

        #feedback { font-size: 1.5rem; font-weight: bold; margin-top: 20px; min-height: 35px; }
        .correct { color: #4cd137; }
        .wrong { color: #e84118; }

        .progress { margin-top: 20px; font-size: 0.9rem; color: #999; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1>🌸 한자 팡팡!</h1>
        <p class="info-text">너의 이름을 알려줘!</p>
        <input type="text" id="user-name" placeholder="이름을 입력하세요">
        
        <p class="info-text">도전할 급수를 선택해줘!</p>
        <select id="grade-select">
            <option value="all">전체 급수 (8급~6급)</option>
            <option value="8">8급 (50자)</option>
            <option value="7">7급 (100자)</option>
            <option value="6">6급 (150자)</option>
        </select>
        <br>
        <button onclick="startGame()">게임 시작!</button>
    </div>

    <div id="quiz-screen" class="quiz-box">
        <div id="stage-info" style="color: #ff9f43; font-size: 1.2rem;"></div>
        <div id="question-area"></div>
        <div id="feedback"></div>
        <div class="progress" id="progress-bar"></div>
    </div>

    <div id="result-screen" class="quiz-box">
        <h1 id="result-title">🎉 참 잘했어요!</h1>
        <p id="final-score" style="font-size: 2rem;"></p>
        <button onclick="location.reload()">다시 하기</button>
    </div>
</div>

        { kanji: '現', read: '현', mean: '나타날', grade: '6' }, { kanji: '形', read: '형', mean: '모양', grade: '6' },
        { kanji: '號', read: '호', mean: '이름', grade: '6' }, { kanji: '和', read: '화', mean: '화목할', grade: '6' },
        { kanji: '畫', read: '화', mean: '그림', grade: '6' }, { kanji: '黃', read: '황', mean: '누를', grade: '6' },

    ];

    let activeVocabulary = [];
    let userName = "";
    let selectedGrade = "all";
    let currentSet = 1;
    let currentIdx = 0;
    let score = 0;
    let setWords = [];
    let isAnswering = false;
    const QUESTIONS_PER_SET = 10; // 무작위로 추출할 출제 문제 수 (10문제)

    function startGame() {
        userName = document.getElementById('user-name').value.trim() || "친구";
        selectedGrade = document.getElementById('grade-select').value;
        
        // 선택 급수에 맞춰 한자 필터링
        if (selectedGrade === "all") {
            activeVocabulary = [...rawVocabulary];
        } else {
            activeVocabulary = rawVocabulary.filter(item => item.grade === selectedGrade);
        }

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadSet(1);
    }

    function loadSet(setNum) {
        currentSet = setNum;
        currentIdx = 0;
        
        // 급수 한자 무작위 셔플 후 10문제 추출
        let shuffled = [...activeVocabulary].sort(() => Math.random() - 0.5);
        let count = Math.min(QUESTIONS_PER_SET, shuffled.length);
        setWords = shuffled.slice(0, count);

        showQuestion();
    }

    function maskWord(word, percent) {
        if (percent === 100) return '○'.repeat(word.length);
        
        let masked = word.split('');
        let count = Math.ceil(word.length * (percent / 100));
        let indices = Array.from({length: word.length}, (_, i) => i).filter(i => word[i] !== ' ');

        for(let i = 0; i < count && indices.length > 0; i++) {
            let randIdx = Math.floor(Math.random() * indices.length);
            let target = indices.splice(randIdx, 1)[0];
            masked[target] = '○';
        }
        return masked.join('');
    }

    function getSetTitle() {
        if(currentSet === 1) return "세트 1: 한자의 뜻과 음 찾기 (객관식)";
        if(currentSet === 2) return "세트 2: 한자음 써넣기 (20% 가림)";
        if(currentSet === 3) return "세트 3: 한자음 써넣기 (50% 가림)";
        return "세트 4: 한자음 써넣기 (100% 가림)";
    }

    function showQuestion() {
        isAnswering = false;
        const area = document.getElementById('question-area');
        const feedback = document.getElementById('feedback');
        const stageInfo = document.getElementById('stage-info');
        const progress = document.getElementById('progress-bar');

        feedback.innerHTML = "";
        let gradeLabel = selectedGrade === 'all' ? '전체 급수' : `${selectedGrade}급`;
        stageInfo.innerText = `[${gradeLabel}] ${getSetTitle()}`;
        progress.innerText = `진행률: ${currentIdx + 1} / ${setWords.length}`;

        const item = setWords[currentIdx];
        const fullAnswerText = `${item.mean} ${item.read}`;
        let html = "";

        if(currentSet === 1) {
            // 세트 1: 객관식
            html = `<div class="word-display">${item.kanji}</div><div class="options">`;
            let choices = [fullAnswerText];
            while(choices.length < 4) {
                let randObj = rawVocabulary[Math.floor(Math.random() * rawVocabulary.length)];
                let randChoice = `${randObj.mean} ${randObj.read}`;
                if(!choices.includes(randChoice)) choices.push(randChoice);
            }
            choices.sort(() => Math.random() - 0.5);
            choices.forEach(c => {
                html += `<button class="option-btn" onclick="checkAnswer('${c}')">${c}</button>`;
            });
            html += `</div>`;
        } else {
            // 세트 2,3,4: 주관식 (입력창 예시 문구 제거)
            let maskPercent = currentSet === 2 ? 20 : (currentSet === 3 ? 50 : 100);
            let hint = maskWord(item.read, maskPercent);
            
            html = `
                <div class="word-display">${item.kanji}</div>
                <div class="mean-display">뜻: ${item.mean}</div>
                <div style="font-size: 1.8rem; letter-spacing: 5px; margin-bottom: 15px; color: #ff9f43;">힌트: ${hint}</div>
                <input type="text" id="answer-input" placeholder="한자음을 입력하세요" onkeyup="if(window.event.keyCode==13) checkAnswer(this.value)">
                <br><button onclick="checkAnswer(document.getElementById('answer-input').value)">확인!</button>
            `;
        }
        area.innerHTML = html;
        
        const inputElem = document.getElementById('answer-input');
        if(inputElem) inputElem.focus();
    }

    function checkAnswer(userAns) {
        if(isAnswering) return;
        isAnswering = true;

        const item = setWords[currentIdx];
        const correctAns = currentSet === 1 ? `${item.mean} ${item.read}` : item.read;
        const feedback = document.getElementById('feedback');

        const isCorrect = currentSet === 1 
            ? userAns.trim() === correctAns
            : (userAns.trim() === item.read || userAns.trim() === `${item.mean} ${item.read}` || userAns.trim() === `${item.mean}${item.read}`);

        if(isCorrect) {
            feedback.innerHTML = "<span class='correct'>⭕ 정답이에요! 🌟 (+10점)</span>";
            score += 10;
        } else {
            feedback.innerHTML = `<span class='wrong'>❌ 아쉬워요! 정답은 '${correctAns}'</span>`;
        }

        setTimeout(() => {
            currentIdx++;
            if(currentIdx < setWords.length) {
                showQuestion();
            } else if(currentSet < 4) {
                loadSet(currentSet + 1);
            } else {
                showResult();
            }
        }, 1300);
    }

    function showResult() {
        const questionCount = Math.min(QUESTIONS_PER_SET, activeVocabulary.length);
        const maxScore = questionCount * 4 * 10; // 만점 400점 (10문제 × 4세트 × 10점)
        
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('final-score').innerHTML = 
            `<strong>${userName}</strong> 친구의 총점:<br><span style="font-size: 2.8rem; color: #ff6b6b;">${score}</span> / ${maxScore} 점`;
    }
